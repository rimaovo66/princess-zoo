<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="公主庄园">
<title>公主的声音庄园</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FFF4F8; --paper2:#FFE6F0; --ink:#8A2E5C; --muted:#B5739A; --pink:#FF7EB3; --pinkDeep:#D9558C;
  --lav:#B79CFF; --lavDeep:#8E72E0; --gold:#FFD66B; --line:#FFC6DE; --cover:#E86A9E;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --paper:#3B1F35; --paper2:#4A2643; --ink:#FFE3EF; --muted:#E2A6C4; --line:#6B3A5E; --cover:#9E3D6B; color-scheme:dark; }
}
:root[data-theme="dark"]{ --paper:#3B1F35; --paper2:#4A2643; --ink:#FFE3EF; --muted:#E2A6C4; --line:#6B3A5E; --cover:#9E3D6B; color-scheme:dark; }
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{height:100%; margin:0; overflow:hidden;}
body{background:#BDE8F2; font-family:"ZCOOL KuaiLe","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif; color:var(--ink); -webkit-user-select:none; user-select:none; touch-action:none;}
button{font:inherit; color:inherit; cursor:pointer;}
button:focus-visible,input:focus-visible{outline:3px solid var(--pink); outline-offset:2px;}
#game{position:fixed; inset:0; width:100%; height:100%; display:block;}
.hidden{display:none !important;}

/* HUD */
.coins{position:fixed; left:50%; bottom:calc(14px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%); display:flex; align-items:center; gap:8px; background:rgba(138,46,92,.88); color:#fff; border:3px solid #fff; border-radius:999px; padding:4px 18px 4px 6px; font-size:26px; pointer-events:none;}
.coins svg{width:32px; height:32px;}
.rate{position:fixed; right:calc(12px + env(safe-area-inset-right,0px)); top:calc(12px + env(safe-area-inset-top,0px)); background:rgba(255,255,255,.88); color:#8A2E5C; border:3px solid #fff; border-radius:16px; padding:3px 12px; font-size:15px; pointer-events:none; box-shadow:0 3px 0 #FFB3D1;}
.tools{position:fixed; right:calc(10px + env(safe-area-inset-right,0px)); bottom:calc(10px + env(safe-area-inset-bottom,0px)); display:flex; gap:8px;}
.tools.left{right:auto; left:calc(10px + env(safe-area-inset-left,0px));}
.tool{width:58px; height:58px; border-radius:18px; border:3px solid #fff; background:#FFF4F8; box-shadow:0 4px 0 #FFB3D1; font-size:28px; display:flex; align-items:center; justify-content:center; position:relative; padding:0;}
.tool.book{background:#FF7EB3; box-shadow:0 4px 0 #D9558C;}
.tool .dot{position:absolute; top:-4px; right:-4px; width:16px; height:16px; border-radius:50%; background:#FFD66B; border:2px solid #fff;}
.toast{position:fixed; left:50%; top:calc(14px + env(safe-area-inset-top,0px)); transform:translateX(-50%); background:rgba(255,255,255,.92); color:#8A2E5C; border:3px solid #fff; border-radius:18px; padding:5px 18px; font-size:20px; box-shadow:0 4px 0 #FFB3D1; transition:opacity .5s; pointer-events:none; white-space:nowrap;}
.unlock{position:fixed; left:50%; bottom:calc(76px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%); border:none; border-radius:999px; padding:10px 22px; font-size:19px; color:#fff; background:var(--lav); box-shadow:0 5px 0 var(--lavDeep); white-space:nowrap;}
.unlock:disabled{background:#CDBEE8; box-shadow:0 5px 0 #A898C9;}

/* overlays */
.scrim{position:fixed; inset:0; background:rgba(120,40,90,.3); display:flex; align-items:center; justify-content:center; padding:max(10px,env(safe-area-inset-top,0px)) 10px max(10px,env(safe-area-inset-bottom,0px)); z-index:20;}
.panel{position:relative; background:var(--paper); border:4px solid #fff; border-radius:26px; box-shadow:0 7px 0 #FFB3D1; padding:18px; width:min(440px,100%); max-height:100%; overflow-y:auto; text-align:center;}
.panel h2{margin:0 0 6px; font-weight:400; font-size:26px; color:var(--pink);}
.panel p{margin:6px 0; color:var(--muted); font-size:15px; line-height:1.5;}
.x{position:absolute; top:10px; right:10px; width:40px; height:40px; border-radius:12px; border:3px solid #fff; background:#FF6F9F; color:#fff; font-size:20px; box-shadow:0 3px 0 #D9558C; z-index:2;}
.btn{display:block; width:100%; border:none; border-radius:999px; padding:12px 10px; margin-top:10px; font-size:20px; color:#fff; background:var(--pink); box-shadow:0 5px 0 var(--pinkDeep);}
.btn:active{transform:translateY(3px); box-shadow:0 2px 0 var(--pinkDeep);}
.btn.lav{background:var(--lav); box-shadow:0 5px 0 var(--lavDeep);}
.btn.ghost{background:var(--paper2); color:var(--ink); box-shadow:0 5px 0 var(--line);}
.btn:disabled{opacity:.45; cursor:not-allowed;}
.row{display:flex; gap:10px;}
.row .btn{flex:1;}
.start h1{font-weight:400; font-size:40px; margin:4px 0; color:var(--pink); text-shadow:3px 3px 0 #fff, 5px 5px 0 #FFD0E4;}

/* book */
.book{position:relative; display:flex; width:min(900px,100%); max-height:100%; background:var(--cover); border-radius:22px; padding:10px; box-shadow:0 8px 0 #B9467A;}
.page{flex:1; background:var(--paper); border-radius:14px; padding:16px; overflow-y:auto; min-height:0;}
.page.l{border-radius:14px 4px 4px 14px; display:flex; flex-direction:column; align-items:center; text-align:center; justify-content:center; gap:4px; border-right:2px dashed var(--line);}
.page.r{border-radius:4px 14px 14px 4px;}
.page .big{width:150px; height:150px; border:3px solid var(--line); border-radius:18px; background:var(--paper2);}
.page .big svg{width:100%; height:100%;}
.page h3{margin:0; font-weight:400; font-size:30px; color:var(--ink);}
.inc{background:var(--paper2); border-radius:999px; padding:2px 14px; font-size:16px; color:var(--muted);}
.desc{font-size:17px; color:var(--ink); line-height:1.5; max-width:22em; margin:6px 0;}
.req{font-size:14px; color:var(--pinkDeep); min-height:1em;}
.page.l .btn{max-width:260px;}
.cells{display:grid; grid-template-columns:repeat(auto-fill,minmax(84px,1fr)); gap:10px;}
.cell{aspect-ratio:1; border:3px solid var(--line); border-radius:14px; background:var(--paper2); padding:2px; position:relative;}
.cell svg{width:100%; height:100%;}
.cell[aria-pressed="true"]{border-color:#5BD6A8; box-shadow:0 0 0 2px #5BD6A8;}
.cell .n{position:absolute; right:4px; bottom:2px; font-size:12px; color:var(--muted);}
.sil svg{filter:brightness(0) opacity(.28);}
.cell .lock{position:absolute; left:4px; top:2px; font-size:13px;}
@media (max-aspect-ratio: 1/1){
  .book{flex-direction:column;}
  .page.l{border-radius:14px 14px 4px 4px; border-right:none; border-bottom:2px dashed var(--line); flex:none;}
  .page.r{border-radius:4px 4px 14px 14px;}
  .page .big{width:110px; height:110px;}
}

/* card */
.hero svg{width:110px; height:110px;}
.field{display:flex; align-items:center; gap:8px; margin:10px 0;}
.field label{font-size:15px; color:var(--muted); flex:none; width:52px; text-align:left;}
.field input[type=text]{flex:1; min-width:0; font:inherit; font-size:18px; color:var(--ink); background:var(--paper2); border:3px solid var(--line); border-radius:14px; padding:6px 10px;}
.field input[type=range]{flex:1; accent-color:var(--pink);}
.field output{width:40px; text-align:right; font-size:14px; color:var(--muted);}
.rec{display:flex; flex-direction:column; align-items:center; gap:6px; margin:8px 0 2px;}
.recbtn{width:88px; height:88px; border-radius:50%; border:5px solid #fff; background:var(--pink); color:#fff; font-size:32px; box-shadow:0 6px 0 var(--pinkDeep); position:relative;}
.recbtn.on{background:#FF4F8E;}
.recbtn svg{position:absolute; inset:-9px; width:calc(100% + 18px); height:calc(100% + 18px); transform:rotate(-90deg);}
.rec .hint{font-size:14px; color:var(--muted);}
.err{color:var(--pinkDeep); font-size:14px; min-height:1em;}
.link{border:none; background:none; color:var(--muted); font-size:14px; text-decoration:underline; margin-top:10px;}
.swatches{display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin:6px 0 12px;}
.sw{width:44px; height:44px; border-radius:50%; border:4px solid #fff; box-shadow:0 3px 0 var(--line);}
.sw[aria-pressed="true"]{outline:3px solid var(--pink); outline-offset:2px;}
.wardrobe canvas{width:120px; height:150px;}
.rotate{position:fixed; inset:0; z-index:30; background:linear-gradient(#FFE6F1,#F6E4FF); display:none; flex-direction:column; align-items:center; justify-content:center; gap:14px; text-align:center; padding:24px; color:#8A2E5C; font-size:15px;}
.rotate .phone{width:64px; height:110px; border:6px solid #FF7EB3; border-radius:16px; background:#fff; animation:turn 2.2s ease-in-out infinite;}
@keyframes turn{0%,30%{transform:rotate(0)} 60%,100%{transform:rotate(-90deg)}}
@media (orientation:portrait){ body:not(.portrait-ok) .rotate{display:flex;} }
@media (orientation:landscape) and (max-height:520px){
  .panel{padding:14px;}
  .start h1{font-size:32px;}
  #card .panel{width:min(660px,100%); display:grid; grid-template-columns:160px 1fr; column-gap:16px; align-items:center; text-align:left;}
  #card .panel > *:not(.hero):not(.x){grid-column:2;}
  #card .hero{grid-column:1; grid-row:1 / span 8; display:flex; justify-content:center;}
  #card .hero svg{width:150px; height:150px;}
  #card .field{margin:4px 0;}
  #card .field.nm{padding-right:46px;}
  #card .rec{flex-direction:row; justify-content:flex-start; margin:4px 0; gap:12px;}
  #card .recbtn{width:62px; height:62px; font-size:24px; border-width:4px;}
  #card .btn{margin-top:6px; padding:9px; font-size:18px;}
  #card .link{margin-top:2px; justify-self:start; text-align:left; padding:2px 0;}
}
</style>
</head>
<body>
<canvas id="game" aria-label="公主的庄园，拖动屏幕移动公主，点动物打开它的卡片"></canvas>
<div class="rotate" id="rotate">
  <div class="phone"></div>
  <div style="font-size:26px">把手机横过来玩吧</div>
  <p style="margin:0; color:#B5739A">转不过来的话，先在控制中心关掉「竖排方向锁定」</p>
  <button class="btn ghost" id="portraitOk" style="max-width:240px">竖着也继续玩</button>
</div>

<div class="rate" id="rateEl">每分钟 ★0</div>
<div class="coins"><svg viewBox="0 0 26 26"><circle cx="13" cy="13" r="11" fill="#FFD66B" stroke="#E8A400" stroke-width="2"/><path d="M13 7l1.8 3.7 4 .6-2.9 2.8.7 4L13 16.2 9.4 18.1l.7-4-2.9-2.8 4-.6z" fill="#fff"/></svg><span id="coinEl">0</span></div>
<div class="toast" id="toast" style="opacity:0"></div>
<button class="unlock hidden" id="unlockBtn"></button>

<div class="tools left">
  <button class="tool" id="muteBtn" aria-label="静音">🔊</button>
  <button class="tool" id="wardBtn" aria-label="公主衣柜">👗</button>
</div>
<div class="tools">
  <button class="tool book" id="bookBtn" aria-label="动物图鉴">📖<span class="dot hidden" id="bookDot"></span></button>
  <button class="tool" id="setBtn" aria-label="设置">⚙️</button>
</div>

<!-- start -->
<div class="scrim" id="start">
  <div class="panel start">
    <h1>公主的声音庄园</h1>
    <p id="startText">拖动屏幕带公主在庄园里散步。<br>领养小动物，亲自给它们录叫声，它们每叫一声都会帮你赚星星币。</p>
    <button class="btn" id="startBtn">进入庄园</button>
  </div>
</div>

<!-- book -->
<div class="scrim hidden" id="book">
  <div class="book">
    <button class="x" id="bookClose" aria-label="关闭图鉴">✕</button>
    <div class="page l">
      <div class="big" id="bBig"></div>
      <h3 id="bName">???</h3>
      <div class="inc" id="bInc"></div>
      <div class="desc" id="bDesc"></div>
      <div class="req" id="bReq"></div>
      <button class="btn" id="bAdopt">领养</button>
    </div>
    <div class="page r"><div class="cells" id="cells"></div></div>
  </div>
</div>

<!-- animal card -->
<div class="scrim hidden" id="card">
  <div class="panel">
    <button class="x" id="cardClose" aria-label="关闭">✕</button>
    <div class="hero" id="cHero"></div>
    <div class="field nm"><label for="cName">名字</label><input type="text" id="cName" maxlength="8"></div>
    <div class="rec">
      <button class="recbtn" id="recBtn" aria-label="录音">🎤<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="46" fill="none" stroke="#FFD66B" stroke-width="6" stroke-dasharray="289" stroke-dashoffset="289" id="ring" stroke-linecap="round"/></svg></button>
      <div class="hint" id="recHint"></div>
    </div>
    <div class="err" id="recErr"></div>
    <button class="link" id="importBtn">录不了？从手机里选一段录音</button>
    <input type="file" id="importIn" accept="audio/*" hidden>
    <div class="field"><label for="cPitch">变声</label><input type="range" id="cPitch" min="0.5" max="2" step="0.05"><output id="cPitchOut"></output></div>
    <div class="row"><button class="btn ghost" id="playBtn">▶ 试听</button><button class="btn lav" id="upBtn">升级</button></div>
    <button class="link" id="releaseBtn">送它回森林</button>
  </div>
</div>

<!-- wardrobe -->
<div class="scrim hidden" id="ward">
  <div class="panel wardrobe">
    <button class="x" id="wardClose" aria-label="关闭">✕</button>
    <h2>公主衣柜</h2>
    <canvas id="wardCvs" width="240" height="300"></canvas>
    <p>裙子</p><div class="swatches" id="dressSw"></div>
    <p>头发</p><div class="swatches" id="hairSw"></div>
  </div>
</div>

<!-- settings -->
<div class="scrim hidden" id="settings">
  <div class="panel">
    <button class="x" id="setClose" aria-label="关闭">✕</button>
    <h2>设置</h2>
    <p>拖动屏幕任意位置移动公主，电脑上也可以用方向键或 WASD。点小动物可以改名字、录叫声、升级。</p>
    <p>录音只保存在这台设备上。</p>
    <button class="btn ghost" id="resetBtn">清空存档，重新开始</button>
  </div>
</div>

<script>
(() => {
/* ================= data ================= */
const AREAS = {
  garden:{name:'草莓花园', x:0,    y:0,   w:1100, h:1300, cost:0},
  hill:  {name:'风车山丘', x:1100, y:0,   w:900,  h:650,  cost:1000,  gate:{x:1100,y:330}},
  lake:  {name:'糖果湖',   x:1100, y:650, w:900,  h:650,  cost:15000, gate:{x:1100,y:980}},
};
const WW = 2000, WH = 1300;
const SPECIES = [
  {id:'bunny',  name:'小兔',   area:'garden', price:0,      base:1,    pitch:1.25, size:78, color:'#FFFFFF', inner:'#FFC2DA', ears:'long', acc:'bow', desc:'耳朵比身体还长，最爱偷吃草莓。'},
  {id:'cat',    name:'小猫',   area:'garden', price:40,     base:2,    pitch:1.3,  size:78, color:'#FFE1C2', inner:'#FFB98A', ears:'tri', acc:'crown', whisk:true, desc:'每天睡十八个小时，醒着的时候在照镜子。'},
  {id:'pig',    name:'小猪',   area:'garden', price:150,    base:5,    pitch:0.95, size:80, color:'#FFC9DD', inner:'#FF9EC4', ears:'small', acc:'bow', snout:true, desc:'粉粉的鼻子一拱一拱，闻到蛋糕就跑过来。'},
  {id:'sheep',  name:'小羊',   area:'garden', price:400,    base:11,   pitch:1.1,  size:82, color:'#FFF6FA', inner:'#F7D3E4', ears:'side', acc:'crown', fluff:true, desc:'毛太蓬了，下雨天会变成一朵大云。'},
  {id:'deer',   name:'小鹿',   area:'hill',   price:1200,   base:30,   pitch:1.05, size:88, color:'#E9C29E', inner:'#FFE9D6', ears:'side', acc:'bow', antler:true, spots:true, desc:'角上挂着小蝴蝶结，走路一蹦一跳。'},
  {id:'bear',   name:'小熊',   area:'hill',   price:3000,   base:70,   pitch:0.7,  size:96, color:'#E8C3A8', inner:'#F7DCC8', ears:'round', acc:'bow', muzzle:true, desc:'个子最大，胆子最小，最怕蜜蜂。'},
  {id:'fox',    name:'小狐狸', area:'hill',   price:7000,   base:160,  pitch:1.15, size:84, color:'#FFB27A', inner:'#FFFFFF', ears:'tall', acc:'crown', cheeks:true, desc:'表情很高冷，其实特别想被摸头。'},
  {id:'duck',   name:'小鸭',   area:'lake',   price:18000,  base:350,  pitch:1.5,  size:76, color:'#FFF3A8', inner:'#FFB25C', ears:'none', acc:'bow', beak:true, tuft:true, desc:'在糖果湖里划水，嘎嘎声全庄园都听得见。'},
  {id:'penguin',name:'企鹅',   area:'lake',   price:40000,  base:800,  pitch:1.4,  size:82, color:'#7D86C9', inner:'#FFFFFF', ears:'none', acc:'crown', beak:true, patch:true, desc:'穿着燕尾服，坚持认为自己是王子。'},
  {id:'unicorn',name:'独角兽', area:'lake',   price:120000, base:2000, pitch:1.6,  size:96, color:'#FFFFFF', inner:'#FFC2DA', ears:'tri', acc:'none', horn:true, mane:true, desc:'传说只有声音最可爱的公主才能领养它。'},
];
const SP = Object.fromEntries(SPECIES.map(s=>[s.id,s]));
const DRESSES = ['#FF9EC6','#C7A6FF','#9EE6C9','#FFE08A','#9ED8FF'];
const HAIRS = ['#FFB3D1','#FFE0A3','#C98F6B','#CDB8FF'];

function animalSVG(id){
  const s = SP[id], c = s.color, k = s.inner, L = '#E87AA8';
  const st = `stroke="${L}" stroke-width="2.5" stroke-linejoin="round"`;
  let back='', body='', head='', face='', front='';
  if(s.ears==='long'){
    back += `<g transform="rotate(-12 38 30)"><ellipse cx="38" cy="14" rx="8" ry="19" fill="${c}" ${st}/><ellipse cx="38" cy="15" rx="4" ry="13" fill="${k}"/></g><g transform="rotate(14 62 30)"><ellipse cx="62" cy="14" rx="8" ry="19" fill="${c}" ${st}/><ellipse cx="62" cy="15" rx="4" ry="13" fill="${k}"/></g>`;
  } else if(s.ears==='tri'||s.ears==='tall'||s.ears==='small'){
    const h = s.ears==='tall'?8:s.ears==='small'?22:14, tx = s.ears==='small'?32:30;
    back += `<path d="M28 36 L${tx} ${h} L48 26Z" fill="${c}" ${st}/><path d="M32 32 L33 ${h+8} L43 27Z" fill="${k}"/><path d="M72 36 L${100-tx} ${h} L52 26Z" fill="${c}" ${st}/><path d="M68 32 L67 ${h+8} L57 27Z" fill="${k}"/>`;
  } else if(s.ears==='round'){
    back += `<circle cx="30" cy="27" r="10" fill="${c}" ${st}/><circle cx="30" cy="27" r="5" fill="${k}"/><circle cx="70" cy="27" r="10" fill="${c}" ${st}/><circle cx="70" cy="27" r="5" fill="${k}"/>`;
  } else if(s.ears==='side'){
    back += `<ellipse cx="25" cy="42" rx="11" ry="5.5" transform="rotate(-25 25 42)" fill="${c}" ${st}/><ellipse cx="75" cy="42" rx="11" ry="5.5" transform="rotate(25 75 42)" fill="${c}" ${st}/>`;
  }
  if(s.antler) back += `<path d="M38 26 L32 8 M34 14 L26 10 M62 26 L68 8 M66 14 L74 10" stroke="#B9865E" stroke-width="4" stroke-linecap="round" fill="none"/>`;
  if(s.mane) ['#FFB3D1','#CDB8FF','#AEEFD8','#FFE29A'].forEach((m,i)=>{ back += `<circle cx="${30+i*2}" cy="${26+i*9}" r="9" fill="${m}"/>`; });
  body += `<ellipse cx="50" cy="80" rx="25" ry="17" fill="${c}" ${st}/>`;
  if(s.patch) body += `<ellipse cx="50" cy="82" rx="15" ry="12" fill="#fff"/>`;
  const foot = s.beak?'#FFB25C':c;
  body += `<ellipse cx="40" cy="95" rx="7" ry="4" fill="${foot}" ${st}/><ellipse cx="60" cy="95" rx="7" ry="4" fill="${foot}" ${st}/>`;
  body += `<path d="M28 84 Q34 90 40 84 Q46 90 50 84 Q54 90 60 84 Q66 90 72 84" fill="none" stroke="#FF9EC6" stroke-width="3" stroke-linecap="round"/>`;
  head += `<circle cx="50" cy="46" r="24" fill="${c}" ${st}/>`;

let AC=null; const buffers=new Map(); let playing=0;
function ac(){ if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return null; } } if(AC.state==='suspended') AC.resume(); return AC; }
let dbP=null;
function db(){ if(!dbP) dbP=new Promise((res,rej)=>{ try{ const r=indexedDB.open('pvz_voices',1); r.onupgradeneeded=()=>r.result.createObjectStore('v'); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }catch(e){ rej(e); } }); return dbP; }
async function putVoice(id,blob){ try{ const d=await db(); await new Promise((res,rej)=>{ const tx=d.transaction('v','readwrite'); tx.objectStore('v').put(blob,id); tx.oncomplete=res; tx.onerror=()=>rej(tx.error); }); }catch(e){} }
async function getVoice(id){ try{ const d=await db(); return await new Promise(res=>{ const r=d.transaction('v').objectStore('v').get(id); r.onsuccess=()=>res(r.result||null); r.onerror=()=>res(null); }); }catch(e){ return null; } }
async function delVoice(id){ try{ const d=await db(); d.transaction('v','readwrite').objectStore('v').delete(id); }catch(e){} }
async function loadBuffer(a){
  if(buffers.has(a.uid)) return buffers.get(a.uid);
  const blob=await getVoice(a.uid); if(!blob) return null;
  try{
    const c=ac(); let buf=await c.decodeAudioData(await blob.arrayBuffer());
    if(buf.duration>3.2){ // imported clips: keep the first 3 seconds
      const n=Math.floor(3*buf.sampleRate), cut=c.createBuffer(buf.numberOfChannels,n,buf.sampleRate);
      for(let ch=0; ch<buf.numberOfChannels; ch++) cut.getChannelData(ch).set(buf.getChannelData(ch).subarray(0,n));
      buf=cut;
    }
    buffers.set(a.uid,buf); return buf;
  }catch(e){ return null; }
}
async function playVoice(a, force, vol=1){
  if(S.muted && !force) return;
  if(!force && playing>=3) return;
  const buf=await loadBuffer(a); const c=ac(); if(!buf||!c) return;
  const src=c.createBufferSource(); src.buffer=buf; src.playbackRate.value=a.pitch;
  const g=c.createGain(); g.gain.value=0.95*vol; src.connect(g).connect(c.destination);
  playing++; src.onended=()=>playing--; src.start();
}

/* ================= game loop ================= */
let last=performance.now(), T=0, curArea='garden';
function step(now){
  const dt=Math.min(0.05,(now-last)/1000); last=now; T+=dt;
  // princess
  let ix=0, iy=0;
  if(joy){ const dx=joy.x-joy.sx, dy=joy.y-joy.sy, d=Math.hypot(dx,dy); if(d>8){ const m=Math.min(d,55)/55; ix=dx/d*m; iy=dy/d*m; } }
  if(keys['arrowleft']||keys['a']) ix-=1; if(keys['arrowright']||keys['d']) ix+=1;
  if(keys['arrowup']||keys['w']) iy-=1; if(keys['arrowdown']||keys['s']) iy+=1;
  const im=Math.hypot(ix,iy); if(im>1){ ix/=im; iy/=im; }
  const sp=210;
  P.moving = im>0.05;
  if(P.moving){
    const nx=P.x+ix*sp*dt, ny=P.y+iy*sp*dt;
    if(walkable(nx,P.y)) P.x=nx; if(walkable(P.x,ny)) P.y=ny;
    if(Math.abs(ix)>0.1) P.dir = ix>0?1:-1;
    P.t+=dt;
  }
  // area toast
  const ar=areaAt(P.x,P.y); if(ar!==curArea){ curArea=ar; toast(AREAS[ar].name); }
  // gates
  nearGate=null;
  for(const k of ['hill','lake']){ const A=AREAS[k]; if(!S.unlocked[k] && Math.hypot(P.x-A.gate.x, P.y-A.gate.y)<130) nearGate=k; }
  if(nearGate){ const A=AREAS[nearGate]; unlockBtn.textContent=`解锁「${A.name}」 ★${fmt(A.cost)}`; unlockBtn.disabled=S.coins<A.cost; unlockBtn.classList.remove('hidden'); }
  else unlockBtn.classList.add('hidden');
  // animals
  for(const a of S.animals){
    const r=rt(a); r.bob+=dt;
    if(r.hop>0) r.hop-=dt;
    if(r.wait>0){ r.wait-=dt; }
    else {
      const dx=r.tx-r.x, dy=r.ty-r.y, d=Math.hypot(dx,dy);
      if(d<4){ r.wait=1.5+Math.random()*4; const p=randPoint(homeOf(a)); r.tx=p.x; r.ty=p.y; }
      else {
        const v=(SP[a.sp].size>90?38:48)*dt, nx=r.x+dx/d*v, ny=r.y+dy/d*v;
        if(walkable(nx,ny,20)){ r.x=nx; r.y=ny; r.dir=dx>0?1:-1; } else { r.wait=0.5; const p=randPoint(homeOf(a)); r.tx=p.x; r.ty=p.y; }
      }
    }
    if(!S.unlocked[areaAt(r.x,r.y)]){ const p=randPoint(homeOf(a)); r.x=r.tx=p.x; r.y=r.ty=p.y; }
    if(a.voice && now>=r.next){ cry(a,r); r.next=now+(CRY*0.6+Math.random()*CRY*0.8)*1000; }
  }
  for(const f of floats) f.t+=dt;
  while(floats.length && floats[0].t>1.2) floats.shift();
  draw();
  requestAnimationFrame(step);
}
function cry(a,r){
  const e=income(a); S.coins+=e; r.hop=0.5;
  floats.push({x:r.x, y:r.y-SP[a.sp].size-6, txt:'+'+fmt(e), t:0});
  // louder when the princess is close
  const d=Math.hypot(P.x-r.x,P.y-r.y);
  playVoice(a,false, Math.max(0.25, 1-d/900));
  hud(); saveSoon();
  if(cardUid===a.uid) refreshCard();
}

/* ================= drawing ================= */
function draw(){
  const vw=VW/SC, vh=VH/SC;
  camX = vw>=WW ? (WW-vw)/2 : Math.max(0, Math.min(WW-vw, P.x-vw/2));
  camY = vh>=WH ? (WH-vh)/2 : Math.max(0, Math.min(WH-vh, P.y-vh/2));
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.fillStyle='#BDE8F2'; ctx.fillRect(0,0,VW,VH);
  ctx.setTransform(dpr*SC,0,0,dpr*SC,-camX*dpr*SC,-camY*dpr*SC);
  const vis=(x,y,m=120)=> x>camX-m && x<camX+vw+m && y>camY-m && y<camY+vh+m;

  // water rim & ground
  ctx.fillStyle='#FFE2EC'; rr(-14,-14,WW+28,WH+28,40); ctx.fill();
  ctx.fillStyle='#D8F5E3'; rr(0,0,1100,WH,30); ctx.fill();
  ctx.fillStyle='#EEE2FA'; ctx.fillRect(1100,0,900,650);
  ctx.fillStyle='#D9F2F2'; ctx.fillRect(1100,650,900,650);
  // grass speckles
  ctx.fillStyle='rgba(255,255,255,.35)';
  for(let x=Math.floor(camX/60)*60; x<camX+vw+60; x+=60) for(let y=Math.floor(camY/60)*60; y<camY+vh+60; y+=60){ const o=((x*7+y*13)%37); ctx.beginPath(); ctx.ellipse(x+o,y+(o*3)%40,6,3,0,0,Math.PI*2); ctx.fill(); }
  // paths
  ctx.lineCap='round'; ctx.lineJoin='round';
  const path=()=>{ ctx.beginPath(); ctx.moveTo(300,320); ctx.quadraticCurveTo(360,700,700,700); ctx.quadraticCurveTo(950,700,1100,330);
    ctx.moveTo(700,700); ctx.quadraticCurveTo(900,900,1100,980); ctx.moveTo(1100,330); ctx.quadraticCurveTo(1400,300,1660,330); ctx.moveTo(1100,980); ctx.quadraticCurveTo(1200,820,1300,830); };
  ctx.strokeStyle='#F6D3C4'; ctx.lineWidth=58; path(); ctx.stroke();
  ctx.strokeStyle='#FBE6DA'; ctx.lineWidth=40; path(); ctx.stroke();
  // pond
  ctx.fillStyle='#FFC6DE'; ctx.beginPath(); ctx.ellipse(480,520,150,88,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#A8E4F0'; ctx.beginPath(); ctx.ellipse(480,520,138,76,0,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,.8)'; ctx.lineWidth=3; for(let i=0;i<3;i++){ const w=Math.sin(T*1.5+i)*8; ctx.beginPath(); ctx.moveTo(420+i*40+w,500+i*14); ctx.lineTo(450+i*40+w,500+i*14); ctx.stroke(); }
  lily(440,540); lily(540,495);
  // candy lake
  if(vis(1560,1010,400)){
    ctx.fillStyle='#FFB3D1'; ctx.beginPath(); ctx.ellipse(1560,1010,305,180,0,0,Math.PI*2); ctx.fill();
    const g=ctx.createLinearGradient(0,850,0,1180); g.addColorStop(0,'#B9E8F8'); g.addColorStop(1,'#D9C8FF');
    ctx.fillStyle=g; ctx.beginPath(); ctx.ellipse(1560,1010,290,165,0,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='rgba(255,255,255,.75)'; for(let i=0;i<6;i++){ ctx.globalAlpha=.5+.5*Math.sin(T*2+i); star(1400+i*55,940+(i%3)*50,5); } ctx.globalAlpha=1;
    // candy island
    ctx.fillStyle='#FFF0F6'; ctx.beginPath(); ctx.ellipse(1600,1020,60,26,0,0,Math.PI*2); ctx.fill();
    lollipop(1585,1010); lollipop(1620,1018,'#B79CFF');
    lily(1450,1080); lily(1700,960);
  }
  // strawberries

    const dx=joy.x-joy.sx, dy=joy.y-joy.sy, d=Math.hypot(dx,dy), m=Math.min(d,55);

    ctx.fillStyle='#FFD66B'; ctx.beginPath(); ctx.moveTo(x+dx,b-h-56); ctx.lineTo(x+dx+16,b-h-48); ctx.lineTo(x+dx,b-h-42); ctx.fill(); ctx.fillStyle='#FFF0F6'; });

function windmill(){

function fence(x1,y1,x2,y2){

function princess(c,x,y,dir,wt,look){

/* ================= book ================= */
const bookEl=document.getElementById('book'), cells=document.getElementById('cells');
let bookSel='bunny';
function openBook(){ renderBook(); bookEl.classList.remove('hidden'); }
function renderBook(){
  cells.innerHTML='';
  SPECIES.forEach(sp=>{
    const has=owned(sp.id)>0;
    const b=document.createElement('button'); b.className='cell'+(has?'':' sil'); b.setAttribute('aria-pressed', sp.id===bookSel);
    b.setAttribute('aria-label', has?sp.name:'未发现的动物');
    b.innerHTML = animalSVG(sp.id) + (has?`<span class="n">×${owned(sp.id)}</span>`:'') + (S.unlocked[sp.area]?'':'<span class="lock">🔒</span>');
    b.onclick=()=>{ bookSel=sp.id; renderBook(); };
    cells.appendChild(b);
  });
  const sp=SP[bookSel], has=owned(sp.id)>0, cost=adoptCost(sp);
  const big=document.getElementById('bBig'); big.innerHTML=animalSVG(sp.id); big.className='big'+(has?'':' sil');
  document.getElementById('bName').textContent = has?sp.name:'???';
  document.getElementById('bInc').textContent = `★ +${fmt(sp.base)} / ${CRY}秒`;
  document.getElementById('bDesc').textContent = sp.desc;
  const req=document.getElementById('bReq'), ad=document.getElementById('bAdopt');
  if(!S.unlocked[sp.area]){ req.textContent=`住在「${AREAS[sp.area].name}」，先去解锁那里吧`; ad.disabled=true; }
  else { req.textContent = S.coins<cost ? `还差 ★${fmt(cost-S.coins)}` : ''; ad.disabled=S.coins<cost; }
  ad.textContent = `领养 ★${fmt(cost)}`;
}
document.getElementById('bAdopt').onclick=()=>{
  const sp=SP[bookSel], cost=adoptCost(sp);
  if(S.coins<cost||!S.unlocked[sp.area]) return;
  S.coins-=cost;
  const a={uid:uid(), sp:sp.id, name:sp.name, lvl:1, pitch:sp.pitch, voice:false};
  S.animals.push(a);
  const r=rt(a); const ang=Math.random()*6.28; const nx=P.x+Math.cos(ang)*70, ny=P.y+Math.sin(ang)*40;
  if(walkable(nx,ny,20)){ r.x=nx; r.y=ny; } r.tx=r.x; r.ty=r.y; r.wait=2;

};
document.getElementById('bookBtn').onclick=()=>{ ac(); openBook(); };
document.getElementById('bookClose').onclick=()=>bookEl.classList.add('hidden');
bookEl.addEventListener('click',e=>{ if(e.target===bookEl) bookEl.classList.add('hidden'); });

/* ================= animal card ================= */
const cardEl=document.getElementById('card'), cName=document.getElementById('cName'), cPitch=document.getElementById('cPitch'), cPitchOut=document.getElementById('cPitchOut');
const recBtn=document.getElementById('recBtn'), recHint=document.getElementById('recHint'), recErr=document.getElementById('recErr'), ring=document.getElementById('ring');
const playBtn=document.getElementById('playBtn'), upBtn=document.getElementById('upBtn');
let cardUid=null;
const getA=id=>S.animals.find(a=>a.uid===id);
const pitchLabel=p=> p<0.8?'低沉':p<0.95?'稍低':p<=1.05?'原声':p<1.4?'可爱':'尖尖';
function openCard(id, fresh){
  const a=getA(id); if(!a) return; cardUid=id; ac();
  document.getElementById('cHero').innerHTML=animalSVG(a.sp);
  cName.value=a.name; cPitch.value=a.pitch; recErr.textContent='';
  refreshCard();
  if(fresh) recHint.textContent=`欢迎${SP[a.sp].name}！点一下给它录叫声吧`;
  cardEl.classList.remove('hidden');
}
function refreshCard(){
  const a=getA(cardUid); if(!a) return;
  cPitchOut.textContent=pitchLabel(a.pitch); playBtn.disabled=!a.voice;
  if(!rec) recHint.textContent = a.voice ? `每叫一声 +${fmt(income(a))}，点一下重新录` : '点一下开始录叫声（最长 3 秒）';
  const c=upCost(a); upBtn.textContent=`升级 ★${fmt(c)}`; upBtn.disabled=S.coins<c;
}
cName.addEventListener('input',()=>{ const a=getA(cardUid); if(a){ a.name=cName.value.trim()||SP[a.sp].name; saveSoon(); } });
cPitch.addEventListener('input',()=>{ const a=getA(cardUid); if(a){ a.pitch=parseFloat(cPitch.value); cPitchOut.textContent=pitchLabel(a.pitch); saveSoon(); } });
cPitch.addEventListener('change',()=>{ const a=getA(cardUid); if(a&&a.voice) playVoice(a,true); });
playBtn.onclick=()=>{ const a=getA(cardUid); if(a) playVoice(a,true); };
upBtn.onclick=()=>{ const a=getA(cardUid); if(!a) return; const c=upCost(a); if(S.coins<c) return; S.coins-=c; a.lvl++; save(); hud(); refreshCard(); toast(`${a.name}升到 Lv.${a.lvl} 啦`); };
function closeCard(){ if(rec) stopRec(); cardEl.classList.add('hidden'); cardUid=null; save(); }
document.getElementById('cardClose').onclick=closeCard;
cardEl.addEventListener('click',e=>{ if(e.target===cardEl) closeCard(); });
document.getElementById('releaseBtn').onclick=()=>{
  const a=getA(cardUid); if(!a) return;
  if(S.animals.length<=1){ recErr.textContent='至少要留一只小动物陪公主哦'; return; }
  if(!confirm(`确定要送${a.name}回森林吗？它的叫声录音也会删掉。`)) return;
  S.animals=S.animals.filter(x=>x.uid!==a.uid); delVoice(a.uid); buffers.delete(a.uid); RT.delete(a.uid);
  cardEl.classList.add('hidden'); cardUid=null; save(); hud();
};

let rec=null, recStream=null, recChunks=[], recTimer=null, recStart=0;
recBtn.onclick=()=>{ rec?stopRec():startRec(); };
async function startRec(){
  recErr.textContent='';
  if(!navigator.mediaDevices||!window.MediaRecorder){ recErr.textContent='这个浏览器不支持录音，换 Safari 或 Chrome 打开试试。'; return; }
  try{ recStream=await navigator.mediaDevices.getUserMedia({audio:true}); }
  catch(e){ recErr.textContent='这里打不开麦克风。可以先用手机自带的「语音备忘录」录好，再点下面选进来。'; return; }
  const types=['audio/webm;codecs=opus','audio/mp4','audio/webm','audio/ogg'];
  const mt=types.find(t=>MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported(t));
  try{ rec=mt?new MediaRecorder(recStream,{mimeType:mt}):new MediaRecorder(recStream); }
  catch(e){ recErr.textContent='录音启动失败，请再试一次。'; recStream.getTracks().forEach(t=>t.stop()); return; }
  recChunks=[]; const target=cardUid;
  rec.ondataavailable=e=>{ if(e.data&&e.data.size) recChunks.push(e.data); };
  rec.onstop=async()=>{
    recStream.getTracks().forEach(t=>t.stop());
    const blob=new Blob(recChunks,{type:rec.mimeType||mt||'audio/webm'});
    rec=null; recBtn.classList.remove('on'); ring.style.strokeDashoffset=289;
    await useVoice(target, blob);
  };
  rec.start(); recBtn.classList.add('on'); recStart=performance.now(); recHint.textContent='录音中…再点一下停止';
  const tick=()=>{ if(!rec) return; const p=Math.min(1,(performance.now()-recStart)/3000); ring.style.strokeDashoffset=289*(1-p); requestAnimationFrame(tick); }; tick();
  recTimer=setTimeout(stopRec,3000);
}
function stopRec(){ clearTimeout(recTimer); if(rec&&rec.state!=='inactive') rec.stop(); }
async function useVoice(target, blob){
  const a=getA(target); if(!a) return;
  if(!blob || blob.size<500){ recErr.textContent='好像没录到声音，再试一次吧'; refreshCard(); return; }
  await putVoice(a.uid,blob); buffers.delete(a.uid);
  if(!await loadBuffer(a)){ recErr.textContent='这段录音播放不了，换一段试试'; refreshCard(); return; }
  recErr.textContent='';
  const first=!a.voice; a.voice=true; save(); hud(); refreshCard(); playVoice(a,true);
  rt(a).next=performance.now()+3000;
  if(cardUid===a.uid) recHint.textContent = first ? `${a.name}学会叫啦！以后它会自己叫着赚钱` : '新叫声换好啦';
}
const importIn=document.getElementById('importIn');
document.getElementById('importBtn').onclick=()=>{ ac(); importIn.value=''; importIn.click(); };
importIn.onchange=async()=>{ const f=importIn.files&&importIn.files[0]; if(f&&cardUid) await useVoice(cardUid,f); };

/* ================= wardrobe ================= */
const wardEl=document.getElementById('ward'), wc=document.getElementById('wardCvs').getContext('2d');
function drawWard(){ wc.setTransform(1,0,0,1,0,0); wc.clearRect(0,0,240,300); wc.setTransform(2.6,0,0,2.6,120,270); princess(wc,0,0,1,0,S.look); }
function swatches(el, list, key){
  el.innerHTML='';
  list.forEach((c,i)=>{ const b=document.createElement('button'); b.className='sw'; b.style.background=c; b.setAttribute('aria-pressed', S.look[key]===i); b.setAttribute('aria-label','颜色 '+(i+1));
    b.onclick=()=>{ S.look[key]=i; save(); swatches(el,list,key); drawWard(); }; el.appendChild(b); });
}
document.getElementById('wardBtn').onclick=()=>{ swatches(document.getElementById('dressSw'),DRESSES,'dress'); swatches(document.getElementById('hairSw'),HAIRS,'hair'); drawWard(); wardEl.classList.remove('hidden'); };
document.getElementById('wardClose').onclick=()=>wardEl.classList.add('hidden');
wardEl.addEventListener('click',e=>{ if(e.target===wardEl) wardEl.classList.add('hidden'); });

/* ================= settings / mute ================= */
const setEl=document.getElementById('settings'), muteBtn=document.getElementById('muteBtn');
function syncMute(){ muteBtn.textContent=S.muted?'🔇':'🔊'; muteBtn.setAttribute('aria-label',S.muted?'打开声音':'静音'); }
muteBtn.onclick=()=>{ S.muted=!S.muted; syncMute(); save(); ac(); };
document.getElementById('setBtn').onclick=()=>setEl.classList.remove('hidden');
document.getElementById('setClose').onclick=()=>setEl.classList.add('hidden');
setEl.addEventListener('click',e=>{ if(e.target===setEl) setEl.classList.add('hidden'); });
document.getElementById('resetBtn').onclick=async()=>{
  if(!confirm('确定清空所有存档和录音吗？')) return;
  for(const a of S.animals) await delVoice(a.uid);
  try{ localStorage.removeItem(KEY); localStorage.removeItem('pvz_state_v1'); }catch(e){}
  location.reload();
};

/* ================= start / offline ================= */
(function offline(){
  const secs=Math.min(4*3600, Math.max(0,(Date.now()-(S.last||Date.now()))/1000));
  const earned=Math.floor(rate()/60*secs*0.5);
  if(secs>60 && earned>0){
    S.coins+=earned; const m=Math.round(secs/60);
    document.getElementById('startText').innerHTML=`你不在的 ${m>=60?Math.floor(m/60)+' 小时 ':''}${m%60} 分钟里，小动物们一直在叫，帮你赚了 ★${fmt(earned)}！`;
  }
})();
document.getElementById('startBtn').onclick=()=>{ ac(); document.getElementById('start').classList.add('hidden'); toast(AREAS[curArea].name); if(!S.animals.some(a=>a.voice)) setTimeout(()=>toast('点一下带 🎤 的小动物，给它录叫声', 3500), 2400); };

addEventListener('pagehide',()=>{ S.p={x:Math.round(P.x),y:Math.round(P.y)}; save(); });

syncMute(); hud();
